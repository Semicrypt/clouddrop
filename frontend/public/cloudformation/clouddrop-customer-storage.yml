AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudDrop customer storage setup.
  Creates a private encrypted S3 bucket and an IAM role
  that CloudDrop can assume using an External ID.

Parameters:
  CloudDropPrincipalArn:
    Type: String
    Description: >
      ARN of the CloudDrop AWS principal allowed to assume
      the customer storage role.

    AllowedPattern: "^arn:aws:iam::[0-9]{12}:(role|user)/.+$"

  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 20
    Description: >
      Unique External ID generated by CloudDrop for this user.

  BucketName:
    Type: String
    Default: ""
    Description: >
      Optional globally unique S3 bucket name.
      Leave blank to let AWS CloudFormation generate one.

  EnableVersioning:
    Type: String
    Default: "false"

    AllowedValues:
      - "true"
      - "false"

Conditions:
  HasCustomBucketName:
    !Not
      - !Equals
        - !Ref BucketName
        - ""

  VersioningEnabled:
    !Equals
      - !Ref EnableVersioning
      - "true"

Resources:
  CloudDropStorageBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName:
        !If
          - HasCustomBucketName
          - !Ref BucketName
          - !Ref AWS::NoValue

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      VersioningConfiguration:
        Status:
          !If
            - VersioningEnabled
            - Enabled
            - Suspended

      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads

            Status: Enabled

            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  CloudDropAccessRole:
    Type: AWS::IAM::Role

    Properties:
      Description: >
        Allows CloudDrop to access only this customer's
        CloudDrop S3 bucket.

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              AWS:
                !Ref CloudDropPrincipalArn

            Action:
              - sts:AssumeRole

            Condition:
              StringEquals:
                sts:ExternalId:
                  !Ref ExternalId

      Policies:
        - PolicyName: CloudDropStorageAccess

          PolicyDocument:
            Version: "2012-10-17"

            Statement:
              - Sid: BucketAccess

                Effect: Allow

                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation

                Resource:
                  - !GetAtt CloudDropStorageBucket.Arn

              - Sid: ObjectAccess

                Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject

                Resource:
                  - !Sub "${CloudDropStorageBucket.Arn}/*"

Outputs:
  RoleArn:
    Description: >
      IAM role ARN to paste into CloudDrop.

    Value:
      !GetAtt CloudDropAccessRole.Arn

  BucketName:
    Description: >
      S3 bucket created for CloudDrop storage.

    Value:
      !Ref CloudDropStorageBucket

  Region:
    Description: >
      AWS region where this stack was deployed.

    Value:
      !Ref AWS::Region

  RoleName:
    Description: >
      IAM role created for CloudDrop.

    Value:
      !Ref CloudDropAccessRole
