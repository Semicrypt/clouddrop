services:
  backend:
    build:
      context: ./backend

    container_name: clouddrop-api
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000

      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: "true"
      DATABASE_CA_CERT_PATH: /app/certs/rds-global-bundle.pem

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}

      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      CLOUDDROP_AWS_PRINCIPAL_ARN: ${CLOUDDROP_AWS_PRINCIPAL_ARN}

      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}

      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}

    volumes:
      - /etc/clouddrop/rds-global-bundle.pem:/app/certs/rds-global-bundle.pem:ro

    ports:
      - "127.0.0.1:5000:5000"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5000/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

    networks:
      - clouddrop-production

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""

    container_name: clouddrop-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "127.0.0.1:3000:80"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - clouddrop-production

networks:
  clouddrop-production:
    driver: bridge
