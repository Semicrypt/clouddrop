name: CloudDrop CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: clouddrop
          POSTGRES_USER: clouddrop
          POSTGRES_PASSWORD: clouddrop_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U clouddrop -d clouddrop"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 5000

      POSTGRES_DB: clouddrop
      POSTGRES_USER: clouddrop
      POSTGRES_PASSWORD: clouddrop_test_password

      DATABASE_URL: postgresql://clouddrop:clouddrop_test_password@localhost:5432/clouddrop

      JWT_SECRET: github-actions-test-secret-do-not-use-in-production
      JWT_EXPIRES_IN: 1h

      AWS_REGION: eu-north-1
      AWS_S3_BUCKET: clouddrop-ci-placeholder

      MAX_FILE_SIZE_MB: 10

      SHARE_DEFAULT_EXPIRY_MINUTES: 60
      SHARE_MAX_EXPIRY_MINUTES: 10080

      PUBLIC_BASE_URL: http://localhost:5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run database migrations
        env:
          PGPASSWORD: clouddrop_test_password
        run: |
          psql \
            -h localhost \
            -U clouddrop \
            -d clouddrop \
            -f database/migrations/001_initial_schema.sql

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:5000
        run: npm run build